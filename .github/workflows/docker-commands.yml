name: Docker Build and Push (Commands)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  REG_NO: "12"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: docker build -t "$DOCKERHUB_USERNAME/bse_${REG_NO}_commands:latest" ./bse7_12

      - name: Push image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: docker push "$DOCKERHUB_USERNAME/bse_${REG_NO}_commands:latest"
